name: Release to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.5

    - name: Check tag matches package version
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PKG_VERSION="$(poetry version --short)"
        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "Tag v$TAG_VERSION does not match pyproject.toml version $PKG_VERSION" >&2
          exit 1
        fi

    - name: Install musl-tools
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Build sdist and wheel
      run: |
        poetry build

    # The build script makes the wheel interpreter and platform specific
    # (cp311-cp311-linux_x86_64), which PyPI rejects. The only native code
    # is the static kerf-init, so the wheel runs on any Python 3 and libc.
    - name: Retag wheel for PyPI
      run: |
        file src/kerf/data/kerf-init | grep -q "statically linked"
        pip install wheel auditwheel
        python -m wheel tags --remove --python-tag py3 --abi-tag none \
          --platform-tag manylinux_2_17_x86_64.manylinux2014_x86_64.musllinux_1_1_x86_64 \
          dist/*.whl
        auditwheel show dist/*.whl

    - name: Check the sdist builds a wheel
      run: |
        pip wheel --no-deps -w /tmp/sdist-wheel dist/*.tar.gz

    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kerf-multikernel
    permissions:
      id-token: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/* \
          --repo "$GITHUB_REPOSITORY" \
          --title "kerf ${GITHUB_REF_NAME#v}" \
          --generate-notes

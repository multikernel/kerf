name: Release to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.5

    - name: Check tag matches package version
      if: github.ref_type == 'tag'
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PKG_VERSION="$(poetry version --short)"
        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "Tag v$TAG_VERSION does not match pyproject.toml version $PKG_VERSION" >&2
          exit 1
        fi

    - name: Install musl-tools
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Build sdist and wheel
      run: |
        poetry build

    # The build script makes the wheel interpreter and platform specific
    # (cp311-cp311-linux_x86_64), which PyPI rejects. The only native code
    # is the static kerf-init, so the wheel runs on any Python 3 and libc.
    - name: Retag wheel for PyPI
      run: |
        file src/kerf/data/kerf-init | grep -q "statically linked"
        pip install wheel auditwheel
        python -m wheel tags --remove --python-tag py3 --abi-tag none \
          --platform-tag manylinux_2_17_x86_64.manylinux2014_x86_64.musllinux_1_1_x86_64 \
          dist/*.whl
        auditwheel show dist/*.whl

    - name: Check the sdist builds a wheel
      run: |
        pip wheel --no-deps -w /tmp/sdist-wheel dist/*.tar.gz

    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  packages:
    needs: build
    runs-on: ubuntu-latest
    env:
      NFPM_VERSION: 2.41.1
    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools
        curl -sSfLo /tmp/nfpm.deb \
          "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
        sudo apt-get install -y /tmp/nfpm.deb

    - name: Build init binary
      run: |
        make

    - name: Build deb and rpm
      run: |
        mkdir -p packages
        export VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')"
        nfpm package -f packaging/nfpm.yaml -p deb -t packages/
        nfpm package -f packaging/nfpm.yaml -p rpm -t packages/

    - name: Check the deb installs and runs
      run: |
        sudo apt-get install -y ./packages/*.deb
        kerf --help
        sudo apt-get remove -y kerf
        test ! -e /usr/lib/kerf

    - name: Check the rpm installs and runs
      run: |
        docker run --rm -v "$PWD/packages:/packages:ro" fedora:latest \
          sh -ec 'dnf install -y /packages/*.rpm; kerf --help; dnf remove -y kerf; test ! -e /usr/lib/kerf'

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: packages/

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kerf-multikernel
    permissions:
      id-token: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download distributions and packages
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: dist/

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/* \
          --repo "$GITHUB_REPOSITORY" \
          --title "kerf ${GITHUB_REF_NAME#v}" \
          --generate-notes
